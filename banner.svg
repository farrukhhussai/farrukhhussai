<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03090f"/>
      <stop offset="0.6" stop-color="#0c1c30"/>
      <stop offset="1" stop-color="#081525"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8a84b"/>
      <stop offset="0.6" stop-color="#e2c068"/>
      <stop offset="1" stop-color="#f5e0a0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c8a84b" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <!-- circuit traces -->
  <g fill="none" stroke="#c8a84b" stroke-opacity="0.35" stroke-width="2">
    <path d="M860 40 H960 V90 H1060 V60 H1150"/>
    <path d="M940 220 H990 V180 H1090 V200 H1160"/>
    <path d="M900 130 H1010 V120 H1120"/>
  </g>
  <g fill="#c8a84b" fill-opacity="0.8">
    <circle cx="960" cy="90" r="5"/><circle cx="1060" cy="60" r="5"/><circle cx="1150" cy="60" r="5"/>
    <circle cx="990" cy="180" r="5"/><circle cx="1090" cy="200" r="5"/><circle cx="1120" cy="120" r="5"/>
  </g>
  <!-- neural net nodes -->
  <g stroke="#0ea5e9" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="1010" y1="120" x2="1060" y2="95"/><line x1="1010" y1="120" x2="1060" y2="145"/>
    <line x1="1060" y1="95" x2="1110" y2="120"/><line x1="1060" y1="145" x2="1110" y2="120"/>
  </g>
  <g fill="#38bdf8"><circle cx="1060" cy="95" r="6"/><circle cx="1060" cy="145" r="6"/><circle cx="1010" cy="120" r="6"/></g>
  <!-- text -->
  <rect x="60" y="62" width="56" height="3" fill="url(#gold)"/>
  <text x="60" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#ffffff">Farrukh <tspan fill="url(#gold)">Hussain</tspan></text>
  <text x="62" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="2" fill="#dde4f0">ELECTRICAL ENGINEER  ·  INDUSTRIAL AUTOMATION  ·  AI &amp; DATA SCIENCE</text>
  <text x="62" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8fa3b8">10+ years · Power Systems · PLC/SCADA · MEP Design  |  MEng ECE, University of Windsor</text>
</svg>
